global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'capture'
    static_configs:
      - targets: ['host.docker.internal:8081']
    scrape_interval: 5s

  - job_name: 'parser'
    static_configs:
      - targets: ['parser:8082']
    scrape_interval: 5s

  - job_name: 'simulator'
    static_configs:
      - targets: ['simulator:8083']
    scrape_interval: 5s
