[project]
name = "ics-anomaly-detection"
version = "0.1.0"
description = "ML-based anomaly detection for ICS network traffic"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3.0",
    "numpy>=1.24.0,<2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0,<=2.1.2",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
aws = [
    "boto3>=1.34.0",
]
tracking = [
    "mlflow>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# E501: line too long (handled by formatter)
# N803/N806: ML convention allows X_train, X_val, etc. for feature matrices
# B905: zip without strict= is fine for equal-length known arrays
# UP042: str+Enum is more explicit than StrEnum for serialization
ignore = ["E501", "N803", "N806", "B905", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
