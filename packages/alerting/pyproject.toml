[project]
name = "ics-alerting"
version = "0.1.0"
description = "Alerting service for ICS anomaly detection"
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka>=2.3.0",
    "redis>=5.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# E501: line too long (handled by formatter)
# UP042: str+Enum is more explicit than StrEnum for serialization
# SIM102: collapsible if statements can be more readable when nested
# SIM105: contextlib.suppress() is not always more readable
ignore = ["E501", "UP042", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
