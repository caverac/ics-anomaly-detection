[package]
name = "ics-parser"
version = "0.1.0"
edition = "2021"
authors = ["caverac"]
description = "ICS protocol parser for Modbus, DNP3, and OPC-UA"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Parser combinators
nom = "7.1"

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Hex encoding
hex = "0.4"

# Metrics
prometheus = "0.13"
axum = "0.7"

# Graceful shutdown
tokio-util = "0.7"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "ics-parser"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
