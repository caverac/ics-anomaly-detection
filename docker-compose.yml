services:
  # =============================================================================
  # Infrastructure
  # =============================================================================

  kafka:
    image: bitnami/kafka:3.7
    container_name: ics-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper)
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Topic settings
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_LOG_RETENTION_HOURS=168
      # Performance
      - KAFKA_CFG_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=300000
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ics-network

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: ics-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.raw.packets --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.parsed.modbus --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.parsed.dnp3 --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.parsed.opcua --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.features --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.anomalies --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ics.alerts --partitions 3 --replication-factor 1
        echo "Topics created:"
        kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - ics-network

  redis:
    image: redis:7-alpine
    container_name: ics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ics-network

  # =============================================================================
  # Capture & Parse Services
  # =============================================================================

  capture:
    build:
      context: ./packages/capture
      dockerfile: Dockerfile
    container_name: ics-capture
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - CAPTURE_INTERFACE=eth0
      - CAPTURE_BPF_FILTER=tcp port 502 or tcp port 20000 or tcp port 4840
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=ics.raw.packets
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    ports:
      - "8081:8081"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: host  # Required for packet capture
    profiles:
      - capture  # Only start with --profile capture

  parser:
    build:
      context: ./packages/parser
      dockerfile: Dockerfile
    container_name: ics-parser
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_ID=ics-parser
      - KAFKA_INPUT_TOPIC=ics.raw.packets
      - KAFKA_CLIENT_ID=ics-parser
      - METRICS_PORT=8082
      - RUST_LOG=info
    ports:
      - "8082:8082"
    networks:
      - ics-network
    restart: unless-stopped

  # =============================================================================
  # Traffic Simulator (for testing)
  # =============================================================================

  simulator:
    build:
      context: ./packages/simulator
      dockerfile: Dockerfile
    container_name: ics-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=ics.raw.packets
      - SIMULATOR_RATE=100
      - SIMULATOR_PROTOCOL=modbus
    ports:
      - "8083:8083"
    networks:
      - ics-network
    profiles:
      - simulator

  # =============================================================================
  # Monitoring
  # =============================================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - ics-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ics-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ics-network
    profiles:
      - monitoring

  # =============================================================================
  # Kafka UI (for debugging)
  # =============================================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ics-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=ics-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ics-network
    profiles:
      - debug

networks:
  ics-network:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
