name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # JS/TS Jobs (fast, run first)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  test-js:
    name: Test (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:js

  build-js:
    name: Build (JS/TS)
    runs-on: ubuntu-latest
    needs: [lint-js, typecheck, test-js]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build docs and dashboard
        run: yarn build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: packages/docs/build/
          retention-days: 7

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: packages/dashboard/dist/
          retention-days: 7

  # ===========================================================================
  # Go Jobs
  # ===========================================================================

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: packages/capture/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: packages/capture

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: packages/capture/go.sum

      - name: Run tests
        working-directory: packages/capture
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: packages/capture/coverage.out

  # ===========================================================================
  # Rust Jobs
  # ===========================================================================

  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser

      - name: Run clippy
        working-directory: packages/parser
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: packages/parser
        run: cargo fmt -- --check

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser

      - name: Run tests
        working-directory: packages/parser
        run: cargo test --verbose

  # ===========================================================================
  # Python Jobs
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint simulator
        run: ruff check packages/simulator/src/

      - name: Lint feature-engine
        run: ruff check packages/feature-engine/src/ packages/feature-engine/tests/

      - name: Lint anomaly-detection
        run: ruff check packages/anomaly-detection/src/

      - name: Lint alerting
        run: ruff check packages/alerting/src/

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install feature-engine dependencies
        working-directory: packages/feature-engine
        run: |
          pip install pytest pytest-cov
          pip install -r requirements.txt || pip install numpy pydantic confluent-kafka structlog

      - name: Run feature-engine tests
        working-directory: packages/feature-engine
        run: python -m pytest tests/ -v --cov=src --cov-report=xml
        continue-on-error: true # Tests may not exist yet

  # ===========================================================================
  # Docker Build
  # ===========================================================================

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-js, test-go, test-rust, lint-python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build

  # ===========================================================================
  # Summary
  # ===========================================================================

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed!"
