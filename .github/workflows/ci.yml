name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Go Jobs (run in parallel)
  # ===========================================================================

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: packages/capture/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: packages/capture

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: packages/capture/go.sum

      - name: Run tests
        working-directory: packages/capture
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: packages/capture/coverage.out

  # ===========================================================================
  # Rust Jobs (run in parallel)
  # ===========================================================================

  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rdkafka dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser

      - name: Run clippy
        working-directory: packages/parser
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: packages/parser
        run: cargo fmt -- --check

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rdkafka dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser

      - name: Run tests
        working-directory: packages/parser
        run: cargo test --verbose

  # ===========================================================================
  # Python Jobs (run in parallel)
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint simulator
        run: uvx ruff check packages/simulator/src/

      - name: Lint feature-engine
        run: uvx ruff check packages/feature-engine/src/ packages/feature-engine/tests/

      - name: Lint anomaly-detection
        run: uvx ruff check packages/anomaly-detection/src/

      - name: Lint alerting
        run: uvx ruff check packages/alerting/src/

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install feature-engine dependencies
        working-directory: packages/feature-engine
        run: uv sync --extra dev

      - name: Run feature-engine tests
        working-directory: packages/feature-engine
        run: uv run pytest tests/ -v --cov=src --cov-report=xml

  # ===========================================================================
  # JS/TS Jobs (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  test-js:
    name: Test (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:js

  # ===========================================================================
  # Build (requires all lint/test jobs to pass)
  # ===========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      # Go
      - lint-go
      - test-go
      # Rust
      - lint-rust
      - test-rust
      # Python
      - lint-python
      - test-python
      # JS/TS
      - lint-js
      - typecheck-js
      - test-js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build docs and dashboard
        run: yarn build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: packages/docs/build/
          retention-days: 7

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: packages/dashboard/dist/
          retention-days: 7

  # ===========================================================================
  # Docker Build & E2E Tests
  # ===========================================================================

  build-and-e2e:
    name: Build Docker & E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Remove unnecessary tools to free up space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images with cache
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Run E2E tests
        run: ./scripts/e2e-test.sh
        timeout-minutes: 20

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps -a
          echo ""
          echo "=== Kafka Logs ==="
          docker compose logs kafka --tail=50 || true
          echo ""
          echo "=== Parser Logs ==="
          docker compose logs parser --tail=50 || true
          echo ""
          echo "=== Feature Engine Logs ==="
          docker compose logs feature-engine --tail=50 || true
          echo ""
          echo "=== Anomaly Detection Logs ==="
          docker compose logs anomaly-detection --tail=50 || true
          echo ""
          echo "=== Alerting Logs ==="
          docker compose logs alerting --tail=50 || true
          echo ""
          echo "=== Simulator Logs ==="
          docker compose --profile simulator logs simulator --tail=50 || true

      - name: Cleanup
        if: always()
        run: docker compose --profile simulator down -v --remove-orphans

  # ===========================================================================
  # Deploy Docs to GitHub Pages
  # ===========================================================================

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: [build-and-e2e]
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: ./docs-build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===========================================================================
  # Deploy Infrastructure (CDK)
  # ===========================================================================

  deploy-cdk:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build-and-e2e]
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: aws-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # - name: CDK Diff
      #   working-directory: packages/infrastructure
      #   run: ENVIRONMENT=production yarn cdk diff

      # - name: CDK Deploy
      #   working-directory: packages/infrastructure
      #   run: ENVIRONMENT=production yarn cdk deploy --require-approval never

  # ===========================================================================
  # Summary
  # ===========================================================================

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [build-and-e2e, deploy-docs, deploy-cdk]
    if: always()
    steps:
      - name: Check results
        run: |
          # Build and E2E must succeed
          if [[ "${{ needs.build-and-e2e.result }}" != "success" ]]; then
            echo "Build and E2E tests failed"
            exit 1
          fi

          # Deployments must succeed or be skipped (skipped on PRs)
          if [[ "${{ needs.deploy-docs.result }}" == "failure" ]]; then
            echo "Docs deployment failed"
            exit 1
          fi

          if [[ "${{ needs.deploy-cdk.result }}" == "failure" ]]; then
            echo "CDK deployment failed"
            exit 1
          fi

          echo "All CI checks passed!"
          if [[ "${{ needs.deploy-docs.result }}" == "success" ]]; then
            echo "  ✓ Docs deployed to GitHub Pages"
          fi
          if [[ "${{ needs.deploy-cdk.result }}" == "success" ]]; then
            echo "  ✓ Infrastructure deployed to AWS"
          fi
